name: backend

on:
  push:
    paths:
      - "backend/**"
      - "docker-compose*.yml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose*.yml"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.12-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      SECURITY_SECRET_KEY: test-only-secret-key-0123456789abcdef0123456789abcdef
      MINIO_SECRET_KEY: test-only-minio-secret
      DATABASE_URL: postgresql+asyncpg://slotwise:test@localhost:5432/slotwise_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/0
      OPENSEARCH_URL: http://localhost:9200
      MINIO_ENDPOINT: http://localhost:9000
      MLFLOW_TRACKING_URI: http://localhost:5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Ruff
        working-directory: backend
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: mypy (strict)
        working-directory: backend
        run: mypy app

      - name: Bandit security scan
        working-directory: backend
        run: bandit -c pyproject.toml -r app

      - name: pip-audit vulnerability scan
        working-directory: backend
        run: pip-audit -r requirements.txt --skip-editable

      - name: Unit tests
        working-directory: backend
        run: pytest -m "not integration and not db" --cov=app --cov-report=term-missing

      - name: Worker integration test
        working-directory: backend
        run: pytest -m integration

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      SECURITY_SECRET_KEY: test-only-secret-key-0123456789abcdef0123456789abcdef
      MINIO_SECRET_KEY: test-only-minio-secret
      DATABASE_URL: postgresql+asyncpg://slotwise_app:app-dev-password@localhost:5432/slotwise_test
      DATABASE_MIGRATION_URL: postgresql+asyncpg://slotwise_migrator:migrator-dev-password@localhost:5432/slotwise_test
      DATABASE_APP_ROLE: slotwise_app
      SEED_ADMIN_EMAIL: admin@slotwise.local
      SEED_ADMIN_PASSWORD: CI-Only-Admin-Password-2026!
      TEST_DATABASE_URL: postgresql+asyncpg://slotwise_app:app-dev-password@localhost:5432/slotwise_test
      TEST_MIGRATION_URL: postgresql+asyncpg://slotwise_migrator:migrator-dev-password@localhost:5432/slotwise_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Create least-privilege roles and test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE slotwise_migrator LOGIN PASSWORD 'migrator-dev-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE slotwise_app LOGIN PASSWORD 'app-dev-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE;
          SQL
          createdb -h localhost -U postgres -O slotwise_migrator slotwise_test
          psql -h localhost -U postgres -d slotwise_test \
            -c "GRANT USAGE ON SCHEMA public TO slotwise_app"

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Grant app permissions
        working-directory: backend
        run: python grant_app_permissions.py

      - name: Database, migration and integrity tests
        working-directory: backend
        run: pytest tests/db -m db -p no:cacheprovider
