name: ci

# Everything the project claims to test runs here, in order:
#   lint + typecheck -> unit -> integration -> security -> concurrency -> e2e
# The four database jobs each start a PostgreSQL 16 service container, apply the
# real migrations, and then run the suite — no mocks, no sqlite, no skipped
# specs. E2E drives the real Vite app against the real API and the same database.
on:
  push:
    branches: [main, "m*"]
  pull_request:
    branches: [main]

env:
  # Local to the runner's service container; not a secret.
  DATABASE_URL: postgresql://slotwise:slotwise@localhost:5432/slotwise

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slotwise/api prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  unit:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slotwise/api prisma:generate
      - run: pnpm test:unit

  integration:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slotwise
          POSTGRES_PASSWORD: slotwise
          POSTGRES_DB: slotwise
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slotwise/api prisma:generate
      - name: apply migrations
        run: pnpm --filter @slotwise/api prisma:migrate:deploy
      - name: verify exclusion constraint (23P01)
        run: pnpm --filter @slotwise/api verify:constraint
      - run: pnpm test:integration

  security:
    runs-on: ubuntu-latest
    needs: integration
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slotwise
          POSTGRES_PASSWORD: slotwise
          POSTGRES_DB: slotwise
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slotwise/api prisma:generate
      - name: apply migrations
        run: pnpm --filter @slotwise/api prisma:migrate:deploy
      - run: pnpm test:security

  concurrency:
    runs-on: ubuntu-latest
    needs: security
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slotwise
          POSTGRES_PASSWORD: slotwise
          POSTGRES_DB: slotwise
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slotwise/api prisma:generate
      - name: apply migrations
        run: pnpm --filter @slotwise/api prisma:migrate:deploy
      - run: pnpm test:concurrency

  e2e:
    runs-on: ubuntu-latest
    needs: concurrency
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slotwise
          POSTGRES_PASSWORD: slotwise
          POSTGRES_DB: slotwise
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slotwise/api prisma:generate
      - name: apply migrations
        run: pnpm --filter @slotwise/api prisma:migrate:deploy
      - name: install chromium
        run: pnpm exec playwright install --with-deps chromium
      # Playwright starts the web and API dev servers itself (playwright.config.ts)
      # and global-setup seeds the E2E fixture owner into the migrated database.
      - run: pnpm test:e2e
      - name: upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
