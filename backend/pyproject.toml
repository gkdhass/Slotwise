[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slotwise-backend"
version = "0.1.0"
description = "Slotwise security operations API (Phase 1 foundation)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.162.4",
  "starlette==1.10.0",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "SQLAlchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "celery[redis]==5.4.0",
  "redis==5.2.1",
  "httpx==0.28.1",
  "prometheus-client==0.21.1",
  "greenlet==3.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.4.1.post1",
  "pytest-cov==6.0.0",
  "ruff==0.8.6",
  "mypy==1.14.1",
  "bandit==1.8.0",
  "pip-audit==2.7.3",
  "detect-secrets==1.5.0",
  "pre-commit==4.0.1",
  "types-redis==4.6.0.20241004",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
  "integration: requires external services such as Redis",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "ASYNC", "T20", "PT", "RUF", "ARG", "PERF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "ARG001", "ARG002", "PT011", "PT018"]
"alembic/**" = ["E501", "I001", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_no_return = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "alembic.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = [".venv", "tests", "alembic", "ml"]
skips = ["B101"]

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]
