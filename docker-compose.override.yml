# Development conveniences: bind service ports to loopback only.
# The base file remains the source of truth for the private network.
services:
  api:
    ports:
      - "127.0.0.1:8000:8000"
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "*",
        "--reload",
        "--no-access-log",
      ]
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro

  worker:
    volumes:
      - ./backend/app:/app/app:ro

  frontend:
    ports:
      - "127.0.0.1:5173:8080"

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  opensearch:
    ports:
      - "127.0.0.1:9200:9200"

  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  mlflow:
    ports:
      - "127.0.0.1:5000:5000"

  prometheus:
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    ports:
      - "127.0.0.1:3000:3000"
