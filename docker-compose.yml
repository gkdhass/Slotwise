version: "3.9"
services:
  db:
    image: postgres:16
    container_name: slotwise-db
    environment:
      POSTGRES_USER: slotwise
      POSTGRES_PASSWORD: slotwise
      POSTGRES_DB: slotwise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotwise -d slotwise"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: