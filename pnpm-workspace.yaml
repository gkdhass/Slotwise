packages:
  - apps/*
  - packages/*

# Security override: @prisma/config pins deepmerge-ts 7.1.5, which is vulnerable to
# stack exhaustion on recursive input (GHSA-ggr8-5vv4-36mx). It is a build-time
# dependency of the Prisma CLI only; the API never loads it. Verified by running
# prisma generate + migrate deploy + verify:constraint after the override.
overrides:
  deepmerge-ts: ^8.0.2

allowBuilds:
  argon2: true
  esbuild: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true